name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Dependabot pull requests run with the dependabot secrets scope, which does
    # not include SONAR_TOKEN, so the scan can only ever fail on them. Skipping
    # keeps dependency bumps mergeable; main-branch analysis is unaffected.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Scratch database for the PostgreSQL-gated tests (`#[ignore]` locally).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: haruki
          POSTGRES_PASSWORD: sekai
          POSTGRES_DB: registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haruki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none

      - name: Generate coverage report
        env:
          HARUKI_TEST_REGISTRY_DSN: postgres://haruki:sekai@localhost:5432/registry_test
          HARUKI_TEST_INGEST_DSN: postgres://haruki:sekai@localhost:5432/registry_test
        run: |
          cargo llvm-cov --locked --all-targets --no-report
          # The PostgreSQL-gated tests; one at a time (the registry ones share tables).
          cargo llvm-cov --locked --lib --no-report -- --ignored --test-threads=1 ingest::tests postgres
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

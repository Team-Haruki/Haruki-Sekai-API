name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" and :sha-<sha> image for the release gate and promote-on-tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      extra-directories: tools/ent_generator
      coverage: true
      msrv: "1.94"
      postgres-image: postgres:17-alpine
      env: |
        HARUKI_TEST_REGISTRY_DSN=${CI_POSTGRES_URL}
        HARUKI_TEST_INGEST_DSN=${CI_POSTGRES_URL}
      # PG-gated #[ignore] tests only (same filter as the old sonar.yml), single-threaded,
      # inside the same coverage run. A bare --ignored would also run
      # updater::master_stream::tests::peak_memory_probe (~500 MB msgpack) and
      # ingest_engine::test_direct_ingestion (hard-coded haruki:sekai DSN).
      extra-test-command: $CARGO_TEST --locked --lib -- --ignored --test-threads=1 ingest::tests postgres

  # Custom job: python-uv-ci.yml expects a uv project; these are stdlib-only unittest scripts
  # under tools/ with no pyproject, so a plain setup-python job is enough.
  tools:
    name: Python tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Unit tests with coverage
        run: |
          python -m pip install --only-binary :all: coverage==7.15.3
          python -m coverage run --branch --include='*/tools/generate_mysekai_followups.py,*/tools/ci_reuse.py' -m unittest discover -s tools -p 'test_*.py'
          python -m coverage xml -o coverage/python.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python
          path: coverage/
          retention-days: 3

  sonar:
    name: Sonar
    needs: [rust, tools]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    with:
      args: -Dsonar.qualitygate.wait=true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker
    needs: [rust]
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: seiunx-dev/ci-templates/.github/workflows/docker.yml@v1
    with:
      cache-backend: registry
      cache-mode: max # keeps the cargo-chef cook layer
      pr-paths: |
        Dockerfile
        .dockerignore
        Cargo.*
        src/**
        schema_info.json
        Data/structures/**

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  # Aggregate gate (the pattern from the ci-templates README): release-gate waits for it.
  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [rust, tools, sonar, docker, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

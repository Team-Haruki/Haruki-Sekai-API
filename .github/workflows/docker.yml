name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - 'tools/ci_reuse.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'schema_info.json'
      - 'Data/structures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/team-haruki/haruki-sekai-api
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7

jobs:
  validate:
    name: Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache

  publish:
    name: Docker publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Read package version
        id: version
        run: python3 -c 'import tomllib; print("value=" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])' >> "$GITHUB_OUTPUT"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Find main build for this tag
        id: source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          python3 tools/ci_reuse.py docker >> "$GITHUB_OUTPUT"
      - name: Fetch reusable image
        id: fetch
        if: steps.source.outputs.reuse == 'true'
        continue-on-error: true
        run: docker pull "${IMAGE_NAME}:sha-${GITHUB_SHA}"
      - name: Verify reusable image
        id: image
        if: steps.fetch.outcome == 'success'
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          source_image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          test "$(docker image inspect "$source_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$source_image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$PACKAGE_VERSION"
          printf 'digest=%s\n' "$(docker image inspect "$source_image" --format '{{ index .RepoDigests 0 }}')" >> "$GITHUB_OUTPUT"
      - name: Publish release tags from verified digest
        if: steps.image.outcome == 'success'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE_DIGEST"
      - name: Build and publish image
        if: steps.fetch.outcome != 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}

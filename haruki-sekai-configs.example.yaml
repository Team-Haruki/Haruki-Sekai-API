proxy: ""
jp_sekai_cookie_url: ""

git:
  enabled: false
  username: ""
  email: "@users.noreply.github.com"
  password: ""
  sign_commits: false
  signing_format: "gpg" # gpg | ssh
  signing_key: "" # GPG key id, SSH public/private key path, or SSH public key
  signing_program: "" # optional: gpg.program for GPG or gpg.ssh.program for SSH

redis:
  enabled: true # set it to false if not using redis
  host: "127.0.0.1"
  port: 6379
  password: "" # keep it empty if no password

backend:
  host: "0.0.0.0"
  port: 9999
  ssl: false
  ssl_cert: ""
  ssl_key: ""
  log_level: "INFO"
  main_log_file: "./main.log" # output to console if empty
  access_log: "${time} ${ip} ${status} ${method} ${path}\n"
  access_log_path: "./access.log" # output to console if empty
  sekai_user_jwt_signing_key: ""
  # Shared secret other Haruki nodes must present (Authorization: Bearer ...)
  # to call this node's /internal/* endpoints. Empty disables them entirely.
  internal_token: ""
  enable_trust_proxy: true
  trusted_proxies:
    - "127.0.0.0/8"
    - "::1/128"
    - "192.168.0.0/16"
    - "172.16.0.0/12"
    - "100.64.0.0/10"
    - "10.0.0.0/8"
  proxy_header: "X-Forwarded-For"

database:
  enabled: true # set it to false if not using database
  driver: "postgres" # sqlite | mysql | postgres
  dsn: "postgres://user:pass@host:port/database?sslmode=disable"
  max_connections: 25

master_database:
  enabled: false # set to true to enable master data ingestion into PostgreSQL
  driver: "postgres"
  dsn: "postgres://haruki:sekai@localhost:5432/master_data"
  max_connections: 10
  ingest_concurrency: 2 # master JSON files ingested at once; each holds only a few row batches in memory

registry: # master data manager (`master_registry` binary); ignored by the API server
  host: "0.0.0.0"
  port: 9998
  token: "" # bearer for PUT/POST endpoints and owner webhooks; empty disables them
  state_dir: "./Data/registry" # manifests, publish history, app-identity overrides
  # Registry state in a database instead of JSON files under state_dir (PostgreSQL in production;
  # tables registry_state + registry_publish_history are created on start). Empty keeps the files.
  # On first start with empty tables the files are imported once (and kept). music_metas blobs stay
  # under state_dir either way.
  state_dsn: "" # e.g. "postgres://sekai_api:pass@127.0.0.1:5432/sekai_api"
  # Exactly ONE registry instance per state database: import and publish are not multi-writer
  # safe, and each instance caches current manifests in memory. Tables are created with
  # IF NOT EXISTS only (no migrations). Rollback to files: stop the registry, delete
  # <state_dir>/manifests/*/current.json (otherwise startup keeps the stale pre-DB manifest,
  # since publish_missing skips regions that have one), clear state_dsn, start it again.
  # Master file content: "fs" serves the master directories (default); "pg" stores every
  # published file zstd-compressed and content-addressed in registry_blobs next to the state
  # tables (requires state_dsn), serves retained snapshots' files under blob/{sha256} too, and
  # imports existing manifests in the background on first start. Rollback: set "fs" again.
  blob_store: "fs"
  blob_gc_grace_secs: 86400 # pg: delete unreferenced blobs not referenced by a publish for this long (min 300)
  subscribers: [] # peers to POST /internal/master-updated after a region is published; the body is
  # {server, dataVersion, contentHash, gitCommit, changedFiles, removedFiles} (receivers re-read current)
  # - url: "http://100.64.0.2:9999"
  #   token: "peer-internal-token"
  account_nodes: [] # SekaiAPI nodes to push app identity to on PUT /v1/app/{region}; like every
  # other node-to-node URL here, use internal-network (Tailscale) addresses only — the bearer
  # token is sent in clear over that already-encrypted overlay, never over the public internet
  # - url: "http://100.76.159.97:9999"
  #   token: "that node's backend.internal_token"
  music_metas: # the registry pulls music_metas*.json for consumers (served under /v1/metas)
    enabled: true
    cron: "0 */30 * * * *"
    inject_omakase: true # add the synthetic music_id 10000 rows consumers expect
    sources: {} # per-region URL overrides; "" disables a region (defaults: sekai-data.3-3.dev)

ingest: # registry-driven ingest (`master_ingest` binary); absent = role off. Ignored by the API server
  # and the registry. Requires the registry to run `blob_store: pg` (checked via its /health).
  # Cutover from the in-sync ingest: docs/master-registry-storage-and-ingest.md, part B.
  registry_url: "http://127.0.0.1:9998" # reads only current and blob/{sha256}
  listen: "127.0.0.1:9997" # POST /internal/master-updated, POST /v1/ingest/{target}/{region}/allow-shrink, GET /health
  webhook_token: "" # bearer on both POSTs (= the registry's subscribers[].token); empty = webhook off (404)
  reconcile_cron: "0 */5 * * * *" # fallback reconcile of every region; "" disables the timer
  parse_concurrency: 2 # regions reconciled at once (memory knob: a few ~1 MiB row batches per target per region)
  stage_tables: 25 # a run rewriting more tables than this (or stage_bytes of JSON) commits per table
  stage_bytes: 52428800
  targets:
    - name: main # key of this target's state rows; never reuse or rename
      dsn: "postgres://haruki:sekai@localhost:5432/master_data"
      regions: [jp, en, tw, kr, cn]
      tables: all # or a list of table names / file stems
      schema: "schema_info.json"
      raw: false # opt-in: keep every original row (unknown keys too) in master_raw
      required_tables: default # default = prune protect list; or a list
      min_ratio: 0.5 # a changed file must keep at least this share of its previous rows
      max_connections: 4 # raised to 2 x parse_concurrency + 1 if lower
      create_tables: false # create missing typed tables from the schema
      # statement_timeout_secs: 600 # optional session guards (unset: server setting)
      # idle_in_transaction_timeout_secs: 600
      allow_shrink: [] # - content_hash: "<hex>"  tables: [musics]

# App identity (appVersion/appHash) is no longer polled. Push it to this node
# with `POST /internal/app-identity` (bearer backend.internal_token, body
# {"server":"jp","appVersion":"...","appHash":"..."}) — the registry's
# `PUT /v1/app/{region}` does that for every `registry.account_nodes` entry.

# Haruki Sekai Asset Updater server instances, called on every asset version change.
# `regions` (lowercase jp/en/tw/kr/cn) limits which regions' updates go to a server;
# omit it or leave it empty to send every region. A 409 whose body says the region
# "is disabled" is logged once and not retried; other 409s (job busy) retry 10x at 60 s.
asset_updater_servers:
  - url: "http://127.0.0.1:12345/update_asset"
    authorization: ""
    # regions: [jp, en, cn]

servers:
  jp:
    enabled: false
    api_url: ""
    require_cookies: true
    headers:
      Host: ""
      # fill in other headers as needed
    aes_key_hex: ""
    aes_iv_hex: ""
    account_dir: ""
    master_dir: ""
    version_path: ""
    nuverse_master_data_url: ""
    nuverse_schema_bundle_path: ""
    enable_master_updater: true # check for master data updates periodically
    master_updater_cron: "7 * * * * *" # cron expression, this mean "execute it at every minute at second 7"
    # After a complete master dump (or owner bundle pull), delete master_dir/*.json files it did
    # not produce so tables dropped upstream leave the git mirror and the registry manifest.
    # The producer deletes a table only when two consecutive complete dumps miss it (the set
    # missed last time is kept in prune_pending_path, default ./Data/prune/<region>.json; keep
    # it outside any git worktree). Nothing is deleted when the dump produced fewer than
    # prune_min_ratio of the files present or more than prune_max_files are due. Tables consumers
    # require (deck-service's keys, events, worldBlooms, cards, gachas, ...) are never pruned;
    # prune_protect adds more.
    prune_stale: true
    prune_min_ratio: 0.75
    prune_max_files: 10
    prune_protect: []
    prune_pending_path: ""

  en:
    enabled: false
    api_url: ""
    require_cookies: false
    headers:
      Host: ""
      # fill in other headers as needed
    aes_key_hex: ""
    aes_iv_hex: ""
    account_dir: ""
    master_dir: ""
    version_path: ""
    nuverse_master_data_url: ""
    nuverse_schema_bundle_path: ""
    enable_master_updater: true # check for master data updates periodically
    master_updater_cron: "7 * * * * *" # cron expression, this mean "execute it at every minute at second 7"

  tw:
    enabled: false
    api_url: ""
    require_cookies: false
    headers:
      Host: ""
      # fill in other headers as needed
    aes_key_hex: ""
    aes_iv_hex: ""
    # Set both when the CDN master uses a different cipher from the game API.
    master_aes_key_hex: ""
    master_aes_iv_hex: ""
    account_dir: ""
    master_dir: ""
    version_path: ""
    nuverse_master_data_url: ""
    nuverse_schema_bundle_path: "Data/structures/6.4.0/nuverse_schema_bundle.json"
    enable_master_updater: true # check for master data updates periodically
    master_updater_cron: "7 * * * * *" # cron expression, this mean "execute it at every minute at second 7"

  kr:
    enabled: false
    api_url: ""
    require_cookies: false
    headers:
      Host: ""
      # fill in other headers as needed
    aes_key_hex: ""
    aes_iv_hex: ""
    master_aes_key_hex: "" # optional pair; otherwise uses the game API cipher
    master_aes_iv_hex: ""
    account_dir: ""
    master_dir: ""
    version_path: ""
    nuverse_master_data_url: ""
    nuverse_schema_bundle_path: "Data/structures/6.0.0/nuverse_schema_bundle.json"
    enable_master_updater: true # check for master data updates periodically
    master_updater_cron: "7 * * * * *" # cron expression, this mean "execute it at every minute at second 7"

  cn:
    enabled: false
    api_url: ""
    # Remote Haruki nodes that can serve this region's game API calls (reached
    # over the internal network, e.g. Tailscale IPs). Targets are tried in
    # ascending priority order; the local client joins with local_priority
    # (default 0) and remotes default to 10, so by default local is preferred
    # and remotes are fallbacks. Give an upstream a lower priority than
    # local_priority to prefer it (e.g. route to the node nearest the game
    # server). A region with upstreams but enabled: false is served remote-only.
    # upstreams:
    #   - url: "http://100.64.0.2:9999"
    #     token: "" # must match that node's backend.internal_token
    #     priority: -1
    #     name: "shanghai"
    # local_priority: 0
    #
    # Master-data sync between nodes. Each region has one owner node (running
    # the master updater with its own accounts); other nodes pull from it.
    # On a pulling node: set source_url/source_token to the owner, and
    # poll_cron as the fallback check (the owner's webhook is the fast path).
    # On the owner node: list the pulling peers under notify so they are
    # webhooked immediately after each master update.
    # master_sync:
    #   source_url: "http://100.64.0.2:9999"
    #   source_token: "" # owner's backend.internal_token
    #   poll_cron: "0 */5 * * * *"
    #   notify:
    #     - url: "http://100.64.0.1:9999"
    #       token: "" # that peer's backend.internal_token
    #
    # Remote-account master production: run this region's master updater on
    # this node (download, unpack, ingest, git push all local) while borrowing
    # a peer node's game accounts for the two steps that need them — the
    # login-derived version probe and (CP servers) the authenticated
    # master-split fetch, which the peer relays as an untouched encrypted byte
    # stream. Use together with enable_master_updater/master_updater_cron on a
    # node that has no local accounts for this region. Empty url disables it.
    # master_remote_source:
    #   url: "http://100.64.0.2:9999"
    #   token: "" # that node's backend.internal_token
    require_cookies: false
    headers:
      Host: ""
      # fill in other headers as needed
    aes_key_hex: ""
    aes_iv_hex: ""
    account_dir: ""
    master_dir: ""
    version_path: ""
    nuverse_master_data_url: ""
    nuverse_schema_bundle_path: "Data/structures/6.4.0/nuverse_schema_bundle.json"
    enable_master_updater: true # check for master data updates periodically
    master_updater_cron: "7 * * * * *" # cron expression, this mean "execute it at every minute at second 7"

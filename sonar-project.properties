sonar.projectKey=Team-Haruki_Haruki-Sekai-API
sonar.organization=team-haruki
sonar.projectVersion=6.22.0
sonar.sourceEncoding=UTF-8
sonar.exclusions=Data/**,src/models/**
sonar.cpd.exclusions=ent_schemas/generated/**,src/models/**,src/testdata/**
sonar.coverage.exclusions=ent_schemas/generated/**,src/db.rs,src/db/entity/**,src/logging.rs,src/main.rs,src/bin/**
sonar.rust.lcov.reportPaths=coverage/lcov-rust.info
sonar.qualitygate.wait=true

sonar.python.coverage.reportPaths=coverage/python.xml
sonar.test.inclusions=tools/test_*.py

# githubactions:S7637 ("use a full commit SHA") flags the shared seiunx-dev/ci-templates
# reusable workflows, which are referenced by their versioned `@v1` tag on purpose (see the
# GitHub Actions section of AGENTS.md). Third-party actions in custom steps stay SHA-pinned.
sonar.issue.ignore.multicriteria=ghaTemplateRef
sonar.issue.ignore.multicriteria.ghaTemplateRef.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.ghaTemplateRef.resourceKey=.github/workflows/**
